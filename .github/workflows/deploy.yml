name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'asia-northeast3' }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION || 'asia-northeast3' }}
  GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY || 'workguard-repo' }}
  SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE_NAME || 'workguard-api' }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Workload Identity Federation 인증에 필요

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # Google Cloud 인증
      # 1) Workload Identity Federation (WIF) 사용 시:
      #    - GCP_WORKLOAD_IDENTITY_PROVIDER: projects/NUM/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
      #    - GCP_SERVICE_ACCOUNT: sa-name@project-id.iam.gserviceaccount.com
      # 2) Service Account Key JSON 사용 시:
      #    - GCP_SA_KEY: 서비스 계정 키 JSON 문자열
      # ----------------------------------------------------
      - name: Authenticate to Google Cloud (WIF)
        if: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (Service Account Key)
        if: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER == '' && secrets.GCP_SA_KEY != '' }}"
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker image
        env:
          IMAGE_TAG: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          IMAGE_LATEST: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:latest
        run: |
          docker build -t $IMAGE_TAG -t $IMAGE_LATEST .
          docker push $IMAGE_TAG
          docker push $IMAGE_LATEST

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          region: ${{ env.GCP_REGION }}
          flags: >-
            --cpu=1
            --memory=512Mi
            --min-instances=0
            --allow-unauthenticated

      - name: Show Cloud Run URL
        run: |
          echo "Deployed service URL: ${{ steps.deploy.outputs.url }}"
