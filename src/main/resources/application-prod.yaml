spring:
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:workguard-506815}
      storage:
        enabled: false

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:AIzaSyDummyKeyForStartup}
        chat:
          options:
            model: gemini-3.7-flash

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: ${PORT:8080}
  shutdown: graceful

logging:
  level:
    root: INFO
    com.workguard: INFO
